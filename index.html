<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Квадрат</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }

    button {
      padding: 14px 28px;
      font-size: 16px;
      background: #2a4a8a;
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #3a5aaa;
    }

    #square {
      width: 200px;
      height: 200px;
      border-radius: 12px;
      background: #333;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      display: none;
    }

    #square:active {
      transform: scale(0.96);
    }

    #square.show {
      display: block;
    }
  </style>
</head>
<body>

  <button id="openBtn">Открыть квадрат</button>
  <div id="square"></div>

  <script src="index.js"></script>
</body>
</html>
